[project]
name = "gcp-mcp-server"
version = "0.1.0"
description = "An MCP server for Google Cloud Platform operations"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-cloud-container>=2.51.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-compute>=1.19.0",
    "google-cloud-resource-manager>=1.12.0",
    "google-auth>=2.35.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
gcp-mcp-server = "gcp_mcp_server.server:main"
